# .github/workflows/ci.yml
name: Crisp CI

on: [push, pull_request]

jobs:
  build-and-test:
    name: Build and Test (SBCL, LLVM 21)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out code
        uses: actions/checkout@v4

      - name: 2. Install System Dependencies (SBCL & LLVM)
        run: |
          # Clear potentially stale FASL cache (critical for fixing encoding glitches)
          rm -rf ~/.cache/common-lisp

          # Install helper packages
          sudo apt-get update
          sudo apt-get install -y sbcl wget gpg-agent software-properties-common lsb-release curl
          
          # Get the LLVM GPG key
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          
          # Manually add the LLVM repository source file
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          
          # Now install the system packages
          sudo apt-get update
          sudo apt-get install -y sbcl llvm-21-dev llvm-21

          # Create a symlink so 'llc' is on the path and our test can find it
          sudo ln -s /usr/bin/llc-21 /usr/bin/llc

      - name: 3. Install Quicklisp
        run: |
          # Download quicklisp.lisp
          curl -O https://beta.quicklisp.org/quicklisp.lisp
          
          # Install it non-interactively.
          # We pipe "echo """ (a newline) to sbcl to
          # automatically answer the "Press Enter to continue"
          # prompt from (ql:add-to-init-file).
          echo "" | sbcl --non-interactive \
                         --load quicklisp.lisp \
                         --eval '(quicklisp-quickstart:install)' \
                         --eval '(ql:add-to-init-file)' \
                         --eval '(quit)'

      - name: 4. Run Crisp Test Script
        run: |
          # We run the test script and pipe its output to 'tee' so we can see it
          # in the CI log. We save the output to a file.
          sbcl --non-interactive --load tests/run-ci.lisp | tee test_output.log

          # Now, we explicitly check the log file for Parachute's failure summary.
          # If "Failed: [1-9]" is found, we exit with an error, failing the CI job.
          ! grep -E "Failed: [1-9]" test_output.log

      - name: 5. Build Executable
        run: |
          # This runs your new build script
          sbcl --non-interactive --load build/build.lisp

      - name: 6. Run End-to-End Tests (Executable)
        run: |
          # Exit immediately if a pipeline returns a non-zero status.
          set -o pipefail

          echo "--- Running E2E: success test (return_7.crisp) ---"
          ./bin/crisp-compile tests/return_7.crisp

          echo "--- Running E2E: success test (def-function_primitive.crisp) ---"
          ./bin/crisp-compile tests/def-function_primitive.crisp

          echo "--- Running E2E: success test --single-pass (def-function_primitive.crisp) ---"
          ./bin/crisp-compile tests/def-function_primitive.crisp --single-pass
 
          echo "--- Running E2E: success test (multipass.crisp) ---"
          ./bin/crisp-compile tests/multipass.crisp

          echo "--- Running E2E: success test (def-function-overloads.crisp) ---"
          ./bin/crisp-compile tests/def-function-overloads.crisp

          echo "--- Running E2E: success test (let-bindings.crisp) ---"
          ./bin/crisp-compile tests/let-bindings.crisp

          echo "--- Running E2E: success test (scratch-cell.crisp) ---"
          ./bin/crisp-compile tests/scratch-cell.crisp

          echo "--- Running E2E: success test --single-pass (scratch-cell.crisp) ---"
          ./bin/crisp-compile tests/scratch-cell.crisp --single-pass


          echo "--- Running E2E: --debug success test (return_7.crisp) ---"
          ./bin/crisp-compile tests/return_7.crisp --debug 

          echo "--- Running E2E: --debug success test (def-function_primitive.crisp) ---"
          ./bin/crisp-compile tests/def-function_primitive.crisp --debug 

          echo "--- Running E2E: --debug success test (def-function-overloads.crisp) ---"
          ./bin/crisp-compile tests/def-function-overloads.crisp --debug

          echo "--- Running E2E: --debug success test (let-bindings.crisp) ---"
          ./bin/crisp-compile tests/let-bindings.crisp --debug

          echo "--- Running E2E: --debug success test (scratch-cell.crisp) ---"
          ./bin/crisp-compile tests/scratch-cell.crisp --debug --single-pass  

          echo "--- Running E2E: --debug --single-pass success test (scratch-cell.crisp) ---"
          ./bin/crisp-compile tests/scratch-cell.crisp --debug --single-pass



          echo "--- Running E2E: --debug success test --single-pass (def-function_primitive.crisp) ---"
          ./bin/crisp-compile tests/def-function_primitive.crisp --single-pass --debug 
 
          echo "--- Running E2E: --debug success test (multipass.crisp) ---"
          ./bin/crisp-compile tests/multipass.crisp --debug 


          echo "--- Running E2E: success test (templates.crisp) ---"
          ./bin/crisp-compile tests/templates.crisp

          echo "--- Running E2E: success test --single-pass (templates.crisp) ---"
          ./bin/crisp-compile tests/templates.crisp --single-pass

          echo "--- Running E2E: success test --debug (templates.crisp) ---"
          ./bin/crisp-compile tests/templates.crisp --debug

          echo "--- Running E2E: success test --debug --single-pass (templates.crisp) ---"
          ./bin/crisp-compile tests/templates.crisp --debug --single-pass


          echo "--- Running E2E: success test (templates_composite.crisp) ---"
          ./bin/crisp-compile tests/templates_composite.crisp

          echo "--- Running E2E: success test --single-pass (templates_composite.crisp) ---"
          ./bin/crisp-compile tests/templates_composite.crisp --single-pass

          echo "--- Running E2E: success test --debug (templates_composite.crisp) ---"
          ./bin/crisp-compile tests/templates_composite.crisp --debug

          echo "--- Running E2E: success test --debug --single-pass (templates_composite.crisp) ---"
          ./bin/crisp-compile tests/templates_composite.crisp --debug --single-pass


          echo "--- Running E2E: success test (higher-order-functions.crisp) ---"
          ./bin/crisp-compile tests/higher-order-functions.crisp

          echo "--- Running E2E: success test --single-pass (higher-order-functions.crisp) ---"
          ./bin/crisp-compile tests/higher-order-functions.crisp --single-pass

          echo "--- Running E2E: success test --debug (higher-order-functions.crisp) ---"
          ./bin/crisp-compile tests/higher-order-functions.crisp --debug


          echo "--- Running E2E: success test (defmacro-01.crisp) ---"
          ./bin/crisp-compile tests/defmacro-01.crisp

          echo "--- Running E2E: success test --single-pass (defmacro-01.crisp) ---"
          ./bin/crisp-compile tests/defmacro-01.crisp --single-pass

          echo "--- Running E2E: success test --debug (defmacro-01.crisp) ---"
          ./bin/crisp-compile tests/defmacro-01.crisp --debug

          echo "--- Running E2E: success test --debug --single-pass (defmacro-01.crisp) ---"
          ./bin/crisp-compile tests/defmacro-01.crisp --debug --single-pass

          echo "--- Running E2E: success test (defmacro-cond.crisp) ---"
          ./bin/crisp-compile tests/defmacro-cond.crisp

          echo "--- Running E2E: success test (let-unified.crisp) ---"
          ./bin/crisp-compile tests/let-unified.crisp

          echo "--- Running E2E: success test --single-pass (let-unified.crisp) ---"
          ./bin/crisp-compile tests/let-unified.crisp --single-pass

          echo "--- Running E2E: success test --debug (let-unified.crisp) ---"
          ./bin/crisp-compile tests/let-unified.crisp --debug

          echo "--- Running E2E: success test --debug --single-pass (let-unified.crisp) ---"
          ./bin/crisp-compile tests/let-unified.crisp --debug --single-pass

          echo "--- Running E2E: success test (branching-comparisons.crisp) ---"
          ./bin/crisp-compile tests/branching-comparisons.crisp

          echo "--- Running E2E: success test --single-pass (branching-comparisons.crisp) ---"
          ./bin/crisp-compile tests/branching-comparisons.crisp --single-pass

          echo "--- Running E2E: success test --debug (branching-comparisons.crisp) ---"
          ./bin/crisp-compile tests/branching-comparisons.crisp --debug

          echo "--- Running E2E: success test --debug --single-pass (branching-comparisons.crisp) ---"
          ./bin/crisp-compile tests/branching-comparisons.crisp --debug --single-pass

          echo "--- Running E2E: success test (branching-if.crisp) ---"
          ./bin/crisp-compile tests/branching-if.crisp

          echo "--- Running E2E: success test --debug (branching-if.crisp) ---"
          ./bin/crisp-compile tests/branching-if.crisp --debug

          echo "--- Running E2E: success test (branching-cond.crisp) ---"
          ./bin/crisp-compile tests/branching-cond.crisp

          echo "--- Running E2E: success test --debug (branching-cond.crisp) ---"
          ./bin/crisp-compile tests/branching-cond.crisp --debug

          echo "--- Running E2E: success test (branching-plus.crisp) ---"
          ./bin/crisp-compile tests/branching-plus.crisp

          echo "--- Running E2E: success test --debug (branching-plus.crisp) ---"
          ./bin/crisp-compile tests/branching-plus.crisp --debug

          echo "--- Running E2E: success test (structs_basic.crisp) ---"
          ./bin/crisp-compile tests/structs_basic.crisp

          echo "--- Running E2E: success test --single-pass (structs_basic.crisp) ---"
          ./bin/crisp-compile tests/structs_basic.crisp --single-pass

          echo "--- Running E2E: success test --debug (structs_basic.crisp) ---"
          ./bin/crisp-compile tests/structs_basic.crisp --debug

          echo "--- Running E2E: success test (structs_templates.crisp) ---"
          ./bin/crisp-compile tests/structs_templates.crisp

          echo "--- Running E2E: success test --single-pass (structs_templates.crisp) ---"
          ./bin/crisp-compile tests/structs_templates.crisp --single-pass

          echo "--- Running E2E: success test --debug (structs_templates.crisp) ---"
          ./bin/crisp-compile tests/structs_templates.crisp --debug

          echo "--- Running E2E: success test (structs_overrides.crisp) ---"
          ./bin/crisp-compile tests/structs_overrides.crisp

          echo "--- Running E2E: success test --single-pass (structs_overrides.crisp) ---"
          ./bin/crisp-compile tests/structs_overrides.crisp --single-pass

          echo "--- Running E2E: success test --debug (structs_overrides.crisp) ---"
          ./bin/crisp-compile tests/structs_overrides.crisp --debug

          echo "--- Running E2E: success test (def-struct-std140.crisp) ---"
          ./bin/crisp-compile tests/def-struct-std140.crisp



          echo "--- Running E2E: failure test to exercise --single-pass flag ---"
          ! ./bin/crisp-compile tests/multipass.crisp --single-pass 2>&1 | grep -F "Unsupported form"
          
          echo "--- Running E2E: failure test (unsupported_keyword.crisp) ---"
          # 1. Run the compiler on the bad file.
          # 2. We EXPECT it to fail, so `!` inverts the exit code.
          # 3. We pipe stderr to stdout (with 2>&1).
          # 4. We use `grep` to check if our error message is present.
          # If it's present, `grep` exits 0 (success).
          # If it's missing, `grep` exits 1 (failure), failing the CI job.
          ! ./bin/crisp-compile tests/errors/unsupported_keyword.crisp 2>&1 | grep -F "Unsupported form"

          echo "--- Running E2E: failure test (unsupported_symbol.crisp) ---"
          ! ./bin/crisp-compile tests/errors/unsupported_symbol.crisp 2>&1 | grep -F "Unsupported form"

          echo "--- Running E2E: failure test (unknown_func_pos.crisp) ---"
          ! ./bin/crisp-compile tests/errors/unknown_func_pos.crisp 2>&1 | grep -F "Unsupported form"

          echo "--- Running E2E: failure test (unknown_type.crisp) ---"
          ! ./bin/crisp-compile tests/errors/unknown_type.crisp 2>&1 | grep -F "Unknown type"

          echo "--- Running E2E: failure test (illegal_promotion.crisp) ---"
          ! ./bin/crisp-compile tests/errors/illegal_promotion.crisp 2>&1 | grep -F "Type mismatch for operator '+'"

          echo "--- Running E2E: failure test (illegal_float_to_int_cast.crisp) ---"
          ! ./bin/crisp-compile tests/errors/illegal_float_to_int_cast.crisp 2>&1 | grep -F "Invalid cast"

          echo "--- Running E2E: failure test (illegal_promotion_float_int.crisp) ---"
          ! ./bin/crisp-compile tests/errors/illegal_promotion_float_int.crisp 2>&1 | grep -F "Type mismatch for operator '+'"

          echo "--- Running E2E: failure test (illegal_promotion_float_int.crisp) ---"
          ! ./bin/crisp-compile tests/errors/illegal_promotion_float_int.crisp 2>&1 | grep -F "Type mismatch for operator '+'"



          echo "--- Running E2E: failure test (illegal_nesting.crisp) ---"
          ! ./bin/crisp-compile tests/errors/illegal_nesting.crisp 2>&1 | grep -F "Unsupported form"


          echo "--- Running E2E: failure test (empty_body.crisp) ---"
          ! ./bin/crisp-compile tests/errors/empty_body.crisp 2>&1 | grep -F "Type mismatch! Expected I32 but inferred NIL"

          echo "--- Running E2E: failure test (arity_mismatch.crisp) ---"
          ! ./bin/crisp-compile tests/errors/arity_mismatch.crisp 2>&1 | grep -F "Arity mismatch!"

          echo "--- Running E2E: failure test (wrong_num_args.crisp) ---"
          ! ./bin/crisp-compile tests/errors/wrong_num_args.crisp 2>&1 | grep -F "Arity mismatch!"

          echo "--- Running E2E: failure test (unbound_var.crisp) ---"
          ! ./bin/crisp-compile tests/errors/unbound_var.crisp 2>&1 | grep -F "Unbound variable"

          echo "--- Running E2E: failure test (malformed.crisp) ---"
          ! ./bin/crisp-compile tests/errors/malformed.crisp 2>&1 | grep -F "Unexpected end of file"

          echo "--- Running E2E: failure test (malformed_2.crisp) ---"
          ! ./bin/crisp-compile tests/errors/malformed.crisp 2>&1 | grep -F "unmatched close parenthesis"

          echo "--- Running E2E: failure test (recursion.crisp) ---"
          ! ./bin/crisp-compile tests/errors/recursion.crisp 2>&1 | grep -F "Recursion is not allowed"

          echo "--- Running E2E: failure test (recursion_mutual.crisp) ---"
          ! ./bin/crisp-compile tests/errors/recursion_mutual.crisp 2>&1 | grep -F "Recursion is not allowed"

          echo "--- Running E2E: failure test --single-pass (recursion.crisp) ---"
          ! ./bin/crisp-compile tests/errors/recursion.crisp --single-pass 2>&1 | grep -F "Recursion is not allowed"
          echo "--- Running E2E: failure test --single-pass (recursion_mutual.crisp) ---"
          ! ./bin/crisp-compile tests/errors/recursion_mutual.crisp --single-pass 2>&1 | grep -F "Unsupported form"

          echo "--- Running E2E: failure test (template_type_mismatch.crisp) ---"
          ! ./bin/crisp-compile tests/errors/template_type_mismatch.crisp 2>&1 | grep -F "Type mismatch!"

          echo "--- Running E2E: failure test (scratch_cell_leak.crisp) ---"
          ! ./bin/crisp-compile tests/errors/scratch_cell_leak.crisp 2>&1 | grep -F "Type mismatch"

          echo "--- Running E2E: failure test (branching-plus-error.crisp) ---"
          ! ./bin/crisp-compile tests/errors/branching-plus-error.crisp 2>&1 | grep -F "IF+ condition failed to evaluate at compile time"

          echo "--- Running E2E: failure test (reserved_setter_name.crisp) ---"
          ! ./bin/crisp-compile tests/errors/reserved_setter_name.crisp 2>&1 | grep -F "Function name '~X~' is reserved"

          echo "--- Running E2E: failure test (reserved_accessor_not_overloadable.crisp) ---"
          ! ./bin/crisp-compile tests/errors/reserved_accessor_not_overloadable.crisp 2>&1 | grep -F "Function name '~Y~' is reserved"

          echo "--- Running E2E: failure test (struct_inference_return_mismatch.crisp) ---"
          ! ./bin/crisp-compile tests/errors/struct_inference_return_mismatch.crisp 2>&1 | grep -F "Type mismatch"

          echo "--- Running E2E: failure test (struct_inference_ambiguity.crisp) ---"
          ! ./bin/crisp-compile tests/errors/struct_inference_ambiguity.crisp 2>&1 | grep -F "Type mismatch"

