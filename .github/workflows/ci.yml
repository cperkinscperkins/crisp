# .github/workflows/ci.yml
name: Crisp CI

on: [push, pull_request]

jobs:
  build-and-test:
    name: Build and Test (SBCL, LLVM 21)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out code
        uses: actions/checkout@v4
        with:
          lfs: false # keep the CI budget low.  

      - name: 1.5 Remove LFS pointers (confusing the compiler)
        run: |
          rm -f bin/llvm-spirv
          rm -f tools/llvm-spirv-linux
          rm -f tools/llvm-as-linux
          rm -f tools/llc-linux
          rm -f tools/LLVM-C-linux.so

      - name: 1.6 Debug Tool Locations
        run: |
           echo "Checking for llvm-spirv..."
           ls -l bin/llvm-spirv || echo "bin/llvm-spirv not found"
           which llvm-spirv || echo "llvm-spirv not in PATH"

      # - name: 2. Make bundled LLVM tools executable
      #   run: |
      #     chmod +x tools/llvm-as-linux tools/llvm-spirv-linux tools/llc-linux

      # - name: 2.5. Test bundled LLVM tools
      #   run: |
      #     echo "Testing llvm-as..."
      #     ./tools/llvm-as-linux --version || echo "llvm-as failed with code $?"
          
      #     echo "Testing llvm-spirv..."
      #     ./tools/llvm-spirv-linux --version || echo "llvm-spirv failed with code $?"
          
      #     echo "Checking dependencies..."
      #     ldd ./tools/llvm-as-linux
      #     ldd ./tools/llvm-spirv-linux

      - name: 3. Install System Dependencies (SBCL & LLVM)
        run: |
          # Clear potentially stale FASL cache (critical for fixing encoding glitches)
          rm -rf ~/.cache/common-lisp

          # Install helper packages
          sudo apt-get update
          sudo apt-get install -y sbcl wget gpg-agent software-properties-common lsb-release curl
          
          # Get the LLVM GPG key
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          
          # Manually add the LLVM repository source file
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          
          # Install core packages (these should always work)
          sudo apt-get update
          sudo apt-get install -y sbcl llvm-21-dev llvm-21

          # Build llvm-spirv from source for LLVM 21 (avoids Docker Hub rate limits)
          git clone --depth 1 -b llvm_release_210 https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git
          cd SPIRV-LLVM-Translator
          mkdir build && cd build
          cmake .. -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm -DCMAKE_BUILD_TYPE=Release
          make llvm-spirv -j$(nproc)
          sudo cp tools/llvm-spirv/llvm-spirv /usr/bin/llvm-spirv
          cd ../..

          # Create symlinks
          sudo ln -s /usr/bin/llc-21 /usr/bin/llc
          sudo ln -s /usr/bin/llvm-as-21 /usr/bin/llvm-as
          # We just installed llvm-spirv manually, check it
          llvm-spirv --version || echo "⚠️ llvm-spirv build failed"

      - name: 3.5 Build C Validator Image
        run: docker build -t crisp-c-validator -f Dockerfile.validator .

      - name: 4. Install Quicklisp
        run: |
          # Download quicklisp.lisp
          curl -O https://beta.quicklisp.org/quicklisp.lisp
          
          # Install it non-interactively.
          # We pipe "echo """ (a newline) to sbcl to
          # automatically answer the "Press Enter to continue"
          # prompt from (ql:add-to-init-file).
          echo "" | sbcl --non-interactive \
                         --load quicklisp.lisp \
                         --eval '(quicklisp-quickstart:install)' \
                         --eval '(ql:add-to-init-file)' \
                         --eval '(quit)'

      - name: 5. Run Crisp Test Script
        run: |
          # We run the test script and pipe its output to 'tee' so we can see it
          # in the CI log. We save the output to a file.
          sbcl --non-interactive --load tests/run-ci.lisp | tee test_output.log

          # Now, we explicitly check the log file for Parachute's failure summary.
          # If "Failed: [1-9]" is found, we exit with an error, failing the CI job.
          ! grep -E "Failed: [1-9]" test_output.log

      - name: 6. Build Executable
        run: |
          # This runs the master build script
          sbcl --non-interactive --load build/build.lisp

      - name: 7. Run Spec Unit Tests
        env:
          CRISP_USE_SYSTEM_TOOLS: true
        run: |
           set -o pipefail
           echo "--- Running Spec Unit Tests ---"
           sbcl --script tests/run-specs.lisp --only-unit-tests

      - name: 8. Run Specs (External Binary)
        env:
          CRISP_USE_SYSTEM_TOOLS: true
          SKIP_SPIRV_TESTS: false
        run: |
          set -o pipefail
          echo "--- Running Specs: External Binary ---"
          sbcl --script tests/run-specs.lisp --use-binary --skip-unit-tests

      - name: 9. Run Specs (External Binary, Debug)
        env:
          CRISP_USE_SYSTEM_TOOLS: true
          SKIP_SPIRV_TESTS: false
        run: |
          set -o pipefail
          echo "--- Running Specs: External Binary (Debug) ---"
          sbcl --script tests/run-specs.lisp --use-binary --debug --skip-unit-tests

      - name: 10. Run Specs (External Binary, Single Pass)
        env:
          CRISP_USE_SYSTEM_TOOLS: true
          SKIP_SPIRV_TESTS: false
        run: |
          set -o pipefail
          echo "--- Running Specs: External Binary (Single Pass) ---"
          sbcl --script tests/run-specs.lisp --use-binary --single-pass --skip-unit-tests

      - name: 11. Run Specs (External Binary, Differentiate)
        env:
          CRISP_USE_SYSTEM_TOOLS: true
          SKIP_SPIRV_TESTS: false
        run: |
          set -o pipefail
          echo "--- Running Specs: External Binary (Differentiate) ---"
          sbcl --script tests/run-specs.lisp --use-binary --differentiate --skip-unit-tests

      - name: 12. Run Logic Regression (Single Pass)
        env:
          CRISP_USE_SYSTEM_TOOLS: true
        run: |
          set -o pipefail
          echo "--- Running E2E: failure test to exercise --single-pass flag ---"
          ! ./bin/crisp-compile tests/multipass.crisp --single-pass 2>&1 | grep -F "Unsupported form"

      - name: 13. Run Negative Specs
        env:
          CRISP_USE_SYSTEM_TOOLS: true
        run: |
          set -o pipefail
          echo "--- Running Negative Specs (Unified Runner) ---"
          sbcl --script tests/run-error-specs.lisp


