# .github/workflows/ci.yml
name: Crisp CI

on: [push, pull_request]

jobs:
  build-and-test:
    name: Build and Test (SBCL, LLVM 21)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out code
        uses: actions/checkout@v4

      - name: 2. Install System Dependencies (SBCL & LLVM)
        run: |
          # Install helper packages
          sudo apt-get update
          sudo apt-get install -y sbcl wget gpg-agent software-properties-common lsb-release curl
          
          # Get the LLVM GPG key
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          
          # Manually add the LLVM repository source file
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          
          # Now install the system packages
          sudo apt-get update
          sudo apt-get install -y sbcl llvm-21-dev

      - name: 3. Install Quicklisp
        run: |
          # Download quicklisp.lisp
          curl -O https://beta.quicklisp.org/quicklisp.lisp
          
          # Install it non-interactively.
          # We pipe "echo """ (a newline) to sbcl to
          # automatically answer the "Press Enter to continue"
          # prompt from (ql:add-to-init-file).
          echo "" | sbcl --non-interactive \
                         --load quicklisp.lisp \
                         --eval '(quicklisp-quickstart:install)' \
                         --eval '(ql:add-to-init-file)' \
                         --eval '(quit)'

      - name: 4. Run Crisp Test Script
        run: |
          # Run the test script. SBCL will exit with 0 on success
          # or non-zero on error, which will pass/fail the CI step.
          sbcl --non-interactive --load tests/run-ci.lisp

      - name: 5. Build Executable
        run: |
          # This runs your new build script
          sbcl --non-interactive --load build/build.lisp

      - name: 6. Run End-to-End Tests (Executable)
        run: |
          # Exit immediately if a pipeline returns a non-zero status.
          set -o pipefail

          echo "--- Running E2E: success test (return_7.crisp) ---"
          ./bin/crisp-compile tests/return_7.crisp

          echo "--- Running E2E: success test (def-function_primitive.crisp) ---"
          ./bin/crisp-compile tests/def-function_primitive.crisp
 
          echo "--- Running E2E: success test (multipass.crisp) ---"
          ./bin/crisp-compile tests/multipass.crisp
          
          echo "--- Running E2E: failure test (unsupported_keyword.crisp) ---"
          # 1. Run the compiler on the bad file.
          # 2. We EXPECT it to fail, so `!` inverts the exit code.
          # 3. We pipe stderr to stdout (with 2>&1).
          # 4. We use `grep` to check if our error message is present.
          # If it's present, `grep` exits 0 (success).
          # If it's missing, `grep` exits 1 (failure), failing the CI job.
          ! ./bin/crisp-compile tests/errors/unsupported_keyword.crisp 2>&1 | grep -F "Unsupported form"

          echo "--- Running E2E: failure test (unsupported_symbol.crisp) ---"
          ! ./bin/crisp-compile tests/errors/unsupported_symbol.crisp 2>&1 | grep -F "Unsupported form"

          echo "--- Running E2E: failure test (unknown_func_pos.crisp) ---"
          ! ./bin/crisp-compile tests/errors/unknown_func_pos.crisp 2>&1 | grep -F "Unsupported form"

          echo "--- Running E2E: failure test (illegal_nesting.crisp) ---"
          ! ./bin/crisp-compile tests/errors/illegal_nesting.crisp 2>&1 | grep -F "Unsupported form"


          echo "--- Running E2E: failure test (empty_body.crisp) ---"
          ! ./bin/crisp-compile tests/errors/empty_body.crisp 2>&1 | grep -F "Type mismatch! Expected I32 but inferred NIL"

          echo "--- Running E2E: failure test (arity_mismatch.crisp) ---"
          ! ./bin/crisp-compile tests/errors/arity_mismatch.crisp 2>&1 | grep -F "Arity mismatch!"

          echo "--- Running E2E: failure test (wrong_num_args.crisp) ---"
          ! ./bin/crisp-compile tests/errors/wrong_num_args.crisp 2>&1 | grep -F "Arity mismatch!"

          echo "--- Running E2E: failure test (unbound_var.crisp) ---"
          ! ./bin/crisp-compile tests/errors/unbound_var.crisp 2>&1 | grep -F "Unbound variable"

          echo "--- Running E2E: failure test (malformed.crisp) ---"
          ! ./bin/crisp-compile tests/errors/malformed.crisp 2>&1 | grep -F "Unexpected end of file"

          echo "--- Running E2E: failure test (malformed_2.crisp) ---"
          ! ./bin/crisp-compile tests/errors/malformed.crisp 2>&1 | grep -F "unmatched close parenthesis"

          echo "--- Running E2E: failure test (recursion.crisp) ---"
          ! ./bin/crisp-compile tests/errors/recursion.crisp 2>&1 | grep -F "Recursion is not allowed"

          echo "--- Running E2E: failure test (recursion_mutual.crisp) ---"
          ! ./bin/crisp-compile tests/errors/recursion_mutual.crisp 2>&1 | grep -F "Recursion is not allowed"