site_name: Crisp - High Performance GPU Programming
site_description: for GPU kernel development.
site_author: Chris Perkins

theme:
  name: material
  font:
    code: Caslon # will search for it
    text: "Nunito Sans"
  palette:
    # - scheme: slate
    #   primary: deep purple
    #   accent: deep purple
    #   toggle:
    #     icon: material/brightness-4
    #     name: Switch to light mode
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - toc:
      permalink: true

exclude_docs: |
  chapters/
  benchmarks.md
  call_graph.md
  crisp-curios.md
  defmacro-utils.md
  reference.md
  tests.md
  criticsms.md
  elevator_pitches.md

nav:
  - "Welcome": "index.md"
  - "Language Specification": "ideal_001.md"
