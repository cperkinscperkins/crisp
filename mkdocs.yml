site_name: Crisp Language Specification
site_description: A Common Lisp dialect for GPU kernel development.
site_author: Chris Perkins

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - toc:
      permalink: true

exclude_docs: |
  chapters/

nav:
  - "Welcome": "index.md"
  - "Language Specification": "ideal_001.md"
  - "The Blueprint Philosophy": "crisp-curios.md"
  - "Crisp Codebase Reference": "reference.md"
  - "Crisp Testing Guide": "tests.md"
  - "Call Graph": "call_graph.md"
  - "Defmacro Utilities": "defmacro-utils.md"
  - "Benchmarks": "benchmarks.md"
  - "Criticisms": "criticsms.md"
  - "Elevator Pitches": "elevator_pitches.md"
